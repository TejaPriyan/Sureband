[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sureband"
version = "0.1.0"
description = "Distribution-free coverage guarantees for System One decision models (Jev, Laya, Von, typical, decider, or your own)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "sureband contributors" }]
keywords = [
    "conformal-prediction",
    "calibration",
    "system-one",
    "uncertainty-quantification",
    "jev",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
benchmarks = ["datasets>=2.0", "huggingface_hub>=0.20"]

[project.urls]
Homepage = "https://github.com/sureband/sureband"
Issues = "https://github.com/sureband/sureband/issues"

[tool.setuptools.packages.find]
include = ["sureband*"]
